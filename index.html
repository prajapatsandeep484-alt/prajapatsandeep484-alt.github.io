<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Sun Stones Hyderabad — granite, granite tiles and quartz. Hayathnagar, Hyderabad. Serving since May 2017.">
<title>Sun Stones Hyderabad | Granite & Quartz</title>
<style>
:root{
  --ink:#172027; --muted:#657078; --stone:#f5f1ea; --white:#fff;
  --gold:#c28a3d; --gold2:#e1b36b; --dark:#11181d; --line:#e5ddd1;
  --shadow:0 18px 50px rgba(16,24,29,.10);
}
*{box-sizing:border-box;scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:#fff;line-height:1.6}
a{text-decoration:none;color:inherit}
.container{width:min(1160px,92%);margin:auto}
.topbar{background:var(--dark);color:#fff;font-size:13px}
.topbar .container{display:flex;justify-content:space-between;gap:20px;padding:9px 0}
nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.navin{display:flex;align-items:center;justify-content:space-between;min-height:76px;gap:25px}
.logo{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.08em}
.logoMark{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#d9a45b,#9d6624);color:#fff;font-weight:900;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.logo small{display:block;font-size:10px;letter-spacing:.16em;color:var(--muted);font-weight:700}
.links{display:flex;gap:25px;font-size:14px;font-weight:700}
.links a:hover{color:var(--gold)}
.navcta{background:var(--ink);color:#fff;padding:11px 17px;border-radius:999px;font-size:13px;font-weight:800}
.hero{position:relative;min-height:650px;display:grid;align-items:center;overflow:hidden;background:#171d21}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,14,17,.86),rgba(9,14,17,.50),rgba(9,14,17,.18)),url('images/1000448900.jpg') center/cover}
.hero .container{position:relative;color:#fff;padding:90px 0}
.eyebrow{display:inline-flex;gap:8px;align-items:center;border:1px solid rgba(255,255,255,.28);padding:8px 12px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
h1{font-size:clamp(44px,6vw,78px);line-height:1.02;margin:22px 0 16px;max-width:800px;letter-spacing:-.04em}
.hero p{max-width:650px;font-size:18px;color:#e8ecee}
.slogan{font-family:Georgia,serif;font-size:20px;color:#e0b16b;margin:22px 0}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{padding:14px 20px;border-radius:10px;font-weight:800;font-size:14px;display:inline-block}
.primary{background:var(--gold);color:#fff}.secondary{border:1px solid rgba(255,255,255,.35);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:55px;max-width:700px}
.stat{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:16px 18px}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:#dce1e3}
section{padding:90px 0}
.sectionHead{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:38px}
.kicker{color:var(--gold);font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
h2{font-size:clamp(30px,4vw,48px);line-height:1.08;margin:8px 0 0;letter-spacing:-.03em}
.lead{color:var(--muted);max-width:600px}
.products{background:var(--stone)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(30,35,38,.04);transition:.25s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.card img{width:100%;height:205px;object-fit:cover;display:block}
.cardbody{padding:18px}.tag{font-size:10px;color:var(--gold);font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.card h3{margin:6px 0 4px;font-size:20px}.card p{margin:0;color:var(--muted);font-size:13px}
.palette{display:flex;flex-wrap:wrap;gap:9px;margin-top:30px}
.chip{background:#fff;border:1px solid #dcd2c4;padding:9px 12px;border-radius:999px;font-size:12px;font-weight:700}
.about{display:grid;grid-template-columns:1.05fr .95fr;gap:55px;align-items:center}
.aboutImg{border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.aboutImg img{width:100%;display:block;height:500px;object-fit:cover}
.features{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:30px}
.feature{border-top:2px solid var(--line);padding-top:14px}.feature b{display:block}.feature span{font-size:13px;color:var(--muted)}
.thickness{background:var(--dark);color:#fff}
.thicknessBox{display:grid;grid-template-columns:1fr 1fr;gap:45px;align-items:center}
.big18{font-size:clamp(80px,13vw,160px);line-height:.85;color:var(--gold2);font-weight:900;letter-spacing:-.08em}
.thickness p{color:#c9d0d4}.note{border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:22px;background:rgba(255,255,255,.05)}
.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-auto-rows:220px;gap:14px}
.gallery img{width:100%;height:100%;object-fit:cover;border-radius:16px}
.gallery img:first-child{grid-row:span 2}
.contact{background:linear-gradient(135deg,#f7f2e9,#eee6da)}
.contactGrid{display:grid;grid-template-columns:1.1fr .9fr;gap:30px}
.contactCard{background:#fff;border-radius:20px;padding:30px;box-shadow:var(--shadow)}
.contactItem{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.contactItem:last-child{border-bottom:0}.icon{width:38px;height:38px;border-radius:10px;background:#f1e3cf;display:grid;place-items:center;color:#9b682c;font-weight:900;flex:none}
.contactItem b{display:block}.contactItem span{color:var(--muted);font-size:14px}
.cta{background:var(--ink);color:#fff;border-radius:22px;padding:38px}
.cta h3{font-size:32px;line-height:1.1;margin:0 0 10px}.cta p{color:#c8d0d4}
footer{background:#0d1216;color:#aeb8bd;padding:28px 0;font-size:12px}
.footerin{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.mobileMenu{display:none}
@media(max-width:900px){
  .links{display:none}.mobileMenu{display:block}
  .grid{grid-template-columns:repeat(2,1fr)}
  .about,.thicknessBox,.contactGrid{grid-template-columns:1fr}
  .gallery{grid-template-columns:1fr 1fr;grid-auto-rows:190px}
  .gallery img:first-child{grid-row:span 1;grid-column:span 2}
}
